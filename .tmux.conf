# =============================================================================
# TMUX CONFIG — ~/.tmux.conf
# Prefix key is Ctrl+a (was Ctrl+b)
# =============================================================================

# -----------------------------------------------------------------------------
# PREFIX KEY
# Default is Ctrl+b which requires awkward finger stretching.
# Ctrl+a is much closer — same hand, natural reach.
# Usage: press Ctrl+a before any tmux command.
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# RELOAD CONFIG
# Apply changes to this file without restarting tmux.
# Usage: Ctrl+a r
# -----------------------------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# -----------------------------------------------------------------------------
# MOUSE SUPPORT
# Click to select panes and windows. Scroll with your mouse wheel.
# Drag pane borders to resize. Right-click for a context menu.
# Usage: just use your mouse naturally.
# -----------------------------------------------------------------------------
set -g mouse on

# -----------------------------------------------------------------------------
# SPLIT PANES WITH INTUITIVE KEYS
# Default splits use % and " which are hard to remember.
# | splits vertically (left/right) — the | character looks like a divider.
# - splits horizontally (top/bottom) — the - character looks like a shelf.
# Both open the new pane in the current directory.
# Usage: Ctrl+a |   or   Ctrl+a -
# -----------------------------------------------------------------------------
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# NAVIGATE PANES WITH ARROW KEYS (no prefix needed)
# Move between panes without pressing Ctrl+a first.
# Usage: Alt+ArrowKey to jump to a pane in that direction.
# -----------------------------------------------------------------------------
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# -----------------------------------------------------------------------------
# RESIZE PANES
# Grow/shrink the current pane. Hold prefix and tap arrow keys.
# Usage: Ctrl+a then hold arrow key (repeatable — no need to re-press prefix)
# -----------------------------------------------------------------------------
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5

# -----------------------------------------------------------------------------
# WINDOWS (TABS)
# New window opens in current directory.
# Usage:
#   Ctrl+a c       — new window
#   Ctrl+a ,       — rename current window
#   Ctrl+a n / p   — next / previous window
#   Ctrl+a 1-9     — jump to window by number
#   Ctrl+a w       — visual window list (pick with arrow keys + Enter)
# -----------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# COPY MODE (VI KEYS)
# Scroll back through terminal output and copy text like in vim.
# Usage:
#   Ctrl+a [       — enter copy mode (scroll mode)
#   Arrow keys / Page Up / Page Down — scroll
#   v              — start selection (visual mode)
#   y              — yank (copy) selection, exits copy mode
#   q or Escape    — exit copy mode
#   Ctrl+a ]       — paste copied text
# -----------------------------------------------------------------------------
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "bash -c 'if command -v clip.exe &>/dev/null; then clip.exe; elif command -v wl-copy &>/dev/null; then wl-copy; elif command -v pbcopy &>/dev/null; then pbcopy; else xclip -sel clip; fi'"
bind -T copy-mode-vi Escape send -X cancel

# Mouse drag to select also copies to system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "bash -c 'if command -v clip.exe &>/dev/null; then clip.exe; elif command -v wl-copy &>/dev/null; then wl-copy; elif command -v pbcopy &>/dev/null; then pbcopy; else xclip -sel clip; fi'"

# Scroll up automatically enters copy mode
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" \
  "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# -----------------------------------------------------------------------------
# SESSIONS
# Sessions are independent workspaces (e.g. one per project).
# Usage:
#   Ctrl+a s       — list and switch sessions
#   Ctrl+a $       — rename current session
#   Ctrl+a d       — detach (session keeps running in background)
#   tmux new -s name       — create named session from terminal
#   tmux attach -t name    — reattach to a session
#   tmux ls                — list all sessions
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# CHEATSHEET POPUP
# Forget a shortcut? Press Ctrl+a ? for a floating help overlay.
# Usage: Ctrl+a ?    (press q to close)
# -----------------------------------------------------------------------------
bind h display-popup -E -w 62 -h 30 -b rounded -T " tmux help " "less ~/.tmux-help.txt"

# -----------------------------------------------------------------------------
# APPEARANCE — Monokai theme
# Background: #272822  Foreground: #F8F8F2
# Pink: #F92672  Green: #A6E22E  Yellow: #E6DB74  Cyan: #66D9EF  Purple: #AE81FF
# -----------------------------------------------------------------------------
set -g status-style "bg=#272822,fg=#F8F8F2"
set -g status-left-length 30
set -g status-left "#[fg=#66D9EF,bold] #S #[fg=#75715E]│ "
set -g status-right "#[fg=#75715E] %a %b %d  #[fg=#A6E22E]%H:%M "
set -g status-right-length 40

set -g window-status-format         "#[fg=#75715E] #I:#W "
set -g window-status-current-format "#[fg=#F92672,bold,bg=#3E3D32] #I:#W "
set -g window-status-separator ""

# Pane border colors — active pane highlighted in Monokai pink
set -g pane-border-style "fg=#3E3D32"
set -g pane-active-border-style "fg=#F92672"

# Copy mode highlight color
set -g mode-style "bg=#49483E,fg=#F8F8F2"

# Popup border color
set -g popup-border-style "fg=#66D9EF"

# -----------------------------------------------------------------------------
# MISC QUALITY OF LIFE
# -----------------------------------------------------------------------------
set -g history-limit 10000      # scroll back up to 10k lines
set -g base-index 1             # windows start at 1 not 0 (easier to reach on keyboard)
setw -g pane-base-index 1       # panes too
set -g renumber-windows on      # keep window numbers sequential after closing one
set -sg escape-time 0           # no delay when pressing Escape (important for vim)
set -g focus-events on          # lets vim/nvim know when the window is focused
set -g default-terminal "tmux-256color"

# -----------------------------------------------------------------------------
# SHIFT+ENTER NEWLINE (for multi-line pasting without execution)
# -----------------------------------------------------------------------------
set -s extended-keys on
bind -n S-Enter send-keys C-v C-j
